name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: sentinelops-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/q741242673/sentinelops
  DOCKER_METADATA_SHORT_SHA_LENGTH: 12

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      release_version: ${{ steps.gate.outputs.release_version }}
      soak_run_id: ${{ steps.gate.outputs.soak_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install -e ".[dev]"
      - name: Bind the tag to tested source and a successful soak
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "Only RC tags such as v0.1.0-rc.1 can publish this workflow." >&2
            exit 1
          fi

          release_version="${GITHUB_REF_NAME#v}"
          python scripts/release_version.py \
            --release-version "$release_version" \
            --output artifacts/release-version.json

          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "The release commit is not reachable from origin/main." >&2
            exit 1
          }

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A GitHub Release already exists for $GITHUB_REF_NAME." >&2
            exit 1
          fi

          soak_run_id="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/soak.yml/runs?status=success&per_page=100" \
              --jq ".workflow_runs[]
                | select(.head_sha == \"${GITHUB_SHA}\")
                | select(.head_branch == \"main\")
                | select(.event == \"workflow_dispatch\" or .event == \"schedule\")
                | .id" \
              | head -n 1
          )"
          if [[ -z "$soak_run_id" ]]; then
            echo "No successful soak workflow exists for commit $GITHUB_SHA on main." >&2
            exit 1
          fi

          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "soak_run_id=$soak_run_id" >> "$GITHUB_OUTPUT"
      - run: ruff check .
      - run: pytest -q

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Build Python release packages
        run: |
          set -euo pipefail
          python -m pip install build
          python scripts/release_version.py \
            --release-version "${{ needs.validate.outputs.release_version }}" \
            --output artifacts/release-version.json
          python -m build --outdir artifacts/package
          (
            cd artifacts/package
            sha256sum *.whl *.tar.gz > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - name: Verify the wheel in a clean environment
        run: |
          set -euo pipefail
          python -m venv /tmp/sentinelops-release
          /tmp/sentinelops-release/bin/python -m pip install artifacts/package/*.whl
          /tmp/sentinelops-release/bin/sentinelops --help
          /tmp/sentinelops-release/bin/python - <<'PY'
          import json
          from pathlib import Path
          import sentinelops

          expected = json.loads(
              Path("artifacts/release-version.json").read_text(encoding="utf-8")
          )["python_version"]
          assert sentinelops.__version__ == expected
          PY
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing RC image tag
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE_NAME:$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Container tag $IMAGE_NAME:$RELEASE_VERSION already exists." >&2
            exit 1
          fi
      - name: Prepare immutable container metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.release_version }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=SentinelOps
            org.opencontainers.image.description=Evidence-grounded Kubernetes incident remediation agent
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.release_version }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Build and push the release image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Run the exact image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE_NAME@$IMAGE_DIGEST"
          docker run --rm "$IMAGE_NAME@$IMAGE_DIGEST" --help
      - name: Generate the downloadable SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: artifacts/sentinelops-${{ needs.validate.outputs.release_version }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest container build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Attest the container SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: artifacts/sentinelops-${{ needs.validate.outputs.release_version }}-sbom.spdx.json
          push-to-registry: true
      - name: Attest Python package provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: |
            artifacts/package/*.whl
            artifacts/package/*.tar.gz
      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
      - name: Sign and verify the immutable image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE_NAME@$IMAGE_DIGEST"
          cosign verify \
            --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE_NAME@$IMAGE_DIGEST"
      - name: Create the immutable release evidence manifest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
          SOAK_RUN_ID: ${{ needs.validate.outputs.soak_run_id }}
        run: |
          python scripts/release_manifest.py \
            --release-version "$RELEASE_VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --image-name "$IMAGE_NAME" \
            --image-digest "$IMAGE_DIGEST" \
            --soak-run-id "$SOAK_RUN_ID" \
            --github-run-id "$GITHUB_RUN_ID" \
            --package-dir artifacts/package \
            --sbom "artifacts/sentinelops-${RELEASE_VERSION}-sbom.spdx.json" \
            --output artifacts/release-manifest.json
      - name: Preserve all release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sentinelops-${{ needs.validate.outputs.release_version }}-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 90
      - name: Publish the GitHub prerelease last
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/package/*.whl \
            artifacts/package/*.tar.gz \
            artifacts/package/SHA256SUMS \
            "artifacts/sentinelops-${RELEASE_VERSION}-sbom.spdx.json" \
            artifacts/release-manifest.json \
            artifacts/release-version.json \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "SentinelOps ${RELEASE_VERSION}" \
            --notes-file CHANGELOG.md
