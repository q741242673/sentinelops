apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sentinelops-api-readonly
  namespace: sentinelops-workloads
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/status", "deployments/scale", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sentinelops-executor-write
  namespace: sentinelops-workloads
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/status", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sentinelops-remediation-submit
  namespace: sentinelops-workloads
rules:
  - apiGroups: ["ops.sentinelops.io"]
    resources: ["sentinelremediations"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sentinelops-remediation-controller
  namespace: sentinelops-workloads
rules:
  - apiGroups: ["ops.sentinelops.io"]
    resources: ["sentinelremediations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["ops.sentinelops.io"]
    resources: ["sentinelremediations/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sentinelops-api-readonly
  namespace: sentinelops-workloads
subjects:
  - kind: ServiceAccount
    name: sentinelops-api
    namespace: sentinelops-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sentinelops-api-readonly
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sentinelops-executor-write
  namespace: sentinelops-workloads
subjects:
  - kind: ServiceAccount
    name: sentinelops-executor
    namespace: sentinelops-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sentinelops-executor-write
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sentinelops-remediation-submit
  namespace: sentinelops-workloads
subjects:
  - kind: ServiceAccount
    name: sentinelops-executor
    namespace: sentinelops-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sentinelops-remediation-submit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sentinelops-remediation-controller
  namespace: sentinelops-workloads
subjects:
  - kind: ServiceAccount
    name: sentinelops-remediation-controller
    namespace: sentinelops-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sentinelops-remediation-controller
