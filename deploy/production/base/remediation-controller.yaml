apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelops-remediation-controller
  namespace: sentinelops-system
  labels:
    app.kubernetes.io/name: sentinelops-remediation-controller
    app.kubernetes.io/part-of: sentinelops
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinelops-remediation-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinelops-remediation-controller
        app.kubernetes.io/part-of: sentinelops
    spec:
      serviceAccountName: sentinelops-remediation-controller
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sentinelops-remediation-controller
      containers:
        - name: controller
          image: ghcr.io/your-org/sentinelops-remediation-controller:0.1.0-rc.1
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=true
            - --leader-election-namespace=sentinelops-system
            - --max-concurrent-reconciles=4
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          envFrom:
            - configMapRef:
                name: sentinelops-runtime
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
