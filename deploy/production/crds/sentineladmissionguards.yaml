apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sentineladmissionguards.ops.sentinelops.io
  labels:
    app.kubernetes.io/name: sentineladmissionguard
    app.kubernetes.io/part-of: sentinelops
spec:
  group: ops.sentinelops.io
  scope: Namespaced
  names:
    kind: SentinelAdmissionGuard
    listKind: SentinelAdmissionGuardList
    plural: sentineladmissionguards
    singular: sentineladmissionguard
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - allowedDeploymentWriters
                - allowedRemediationCreators
                - allowedRemediationStatusWriters
                - allowedRemediationDeleters
              properties:
                allowedDeploymentWriters:
                  type: array
                  minItems: 1
                  maxItems: 32
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    minLength: 3
                    maxLength: 253
                allowedRemediationCreators:
                  type: array
                  minItems: 1
                  maxItems: 16
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    minLength: 3
                    maxLength: 253
                allowedRemediationStatusWriters:
                  type: array
                  minItems: 1
                  maxItems: 16
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    minLength: 3
                    maxLength: 253
                allowedRemediationDeleters:
                  type: array
                  maxItems: 16
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    minLength: 3
                    maxLength: 253
