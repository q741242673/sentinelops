apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinelops-gitops-gateway
  namespace: sentinelops-system
  labels:
    app.kubernetes.io/name: sentinelops-gitops-gateway
    app.kubernetes.io/part-of: sentinelops
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinelops-reference-gitops-gateway
  namespace: sentinelops-system
data:
  SENTINELOPS_GITOPS_GITHUB_API_URL: https://api.github.com
  SENTINELOPS_GITOPS_GITHUB_REPOSITORY: replace-owner/replace-config-repo
  SENTINELOPS_GITOPS_GITHUB_BASE_BRANCH: main
  SENTINELOPS_GITOPS_GITHUB_PROPOSAL_PATH: sentinelops/proposals
  SENTINELOPS_GITOPS_GITHUB_TIMEOUT_SECONDS: "15"
  SENTINELOPS_GITOPS_GITHUB_DEADLINE_SECONDS: "45"
  SENTINELOPS_GITOPS_BEARER_TOKEN_FILE: /var/run/secrets/sentinelops/gitops-token
  SENTINELOPS_GITOPS_GITHUB_TOKEN_FILE: /var/run/secrets/sentinelops/gitops-github-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelops-gitops-gateway
  namespace: sentinelops-system
  labels:
    app.kubernetes.io/name: sentinelops-gitops-gateway
    app.kubernetes.io/part-of: sentinelops
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinelops-gitops-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinelops-gitops-gateway
        app.kubernetes.io/part-of: sentinelops
    spec:
      serviceAccountName: sentinelops-gitops-gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/your-org/sentinelops:0.1.0-rc.1
          args: ["gitops-gateway", "--host", "0.0.0.0", "--port", "8020"]
          envFrom:
            - configMapRef:
                name: sentinelops-reference-gitops-gateway
          ports:
            - name: http
              containerPort: 8020
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: gateway-secret
              mountPath: /var/run/secrets/sentinelops
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: gateway-secret
          projected:
            defaultMode: 288
            sources:
              - secret:
                  name: sentinelops-runtime
                  items:
                    - key: gitops-token
                      path: gitops-token
                    - key: gitops-github-token
                      path: gitops-github-token
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sentinelops-gitops-gateway
  namespace: sentinelops-system
spec:
  selector:
    app.kubernetes.io/name: sentinelops-gitops-gateway
  ports:
    - name: http
      port: 8020
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sentinelops-gitops-gateway
  namespace: sentinelops-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinelops-gitops-gateway
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentinelops-gitops-gateway
  namespace: sentinelops-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sentinelops-gitops-gateway
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sentinelops-gitops-publisher
      ports:
        - protocol: TCP
          port: 8020
